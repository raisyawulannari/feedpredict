<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Riwayat Prediksi</title>
  <style>
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #d8f3dc; color: #1b4332; }
  </style>
</head>
<body>
  <h2>Riwayat Prediksi Pakan Ayam</h2>
  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>Tanggal Mulai</th>
        <th>Tanggal Selesai</th>
        <th>Durasi</th>
        <th>Total Karung</th>
      </tr>
    </thead>
    <tbody>
      {% for item in riwayat %}
      <tr>
        <td>{{ loop.index }}</td>
        <td>{{ item.tanggal_mulai }}</td>
        <td>{{ item.tanggal_selesai }}</td>
        <td>{{ item.durasi }}</td>
        <td>{{ item.total_karung|int }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
